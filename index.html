<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互动体验</title>
<style>
body{margin:0;font-family:sans-serif;background:#0a0a0f;color:#f0f0f5}
.container{max-width:600px;margin:0 auto;padding:20px}
h1{text-align:center;color:#e91e63;margin:30px 0}
.card{background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:24px;margin-bottom:20px}
.btn{padding:14px 24px;border:none;border-radius:12px;font-size:1rem;cursor:pointer;margin:8px}
.btn-primary{background:#e91e63;color:#fff}
.btn-secondary{background:#2a2a3a;color:#f0f0f5}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.option{background:#0a0a0f;border:2px solid #2a2a3a;border-radius:12px;padding:20px;text-align:center;cursor:pointer}
.option.selected{border-color:#e91e63;color:#e91e63}
.chat{position:fixed;bottom:20px;right:20px}
.chat-btn{width:60px;height:60px;border-radius:50%;background:#e91e63;border:none;font-size:24px;cursor:pointer}
.chat-panel{display:none;position:absolute;bottom:70px;right:0;width:320px;height:400px;background:#12121a;border:1px solid #2a2a3a;border-radius:16px;padding:16px}
.chat-panel.open{display:flex;flex-direction:column}
.messages{flex:1;overflow-y:auto;margin:10px 0}
.msg{padding:8px 12px;border-radius:8px;margin:4px 0}
.msg.ai{background:#2a2a3a}
.msg.user{background:#e91e63;color:#fff;margin-left:auto}
input{width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #2a2a3a;background:#0a0a0f;color:#f0f0f5}
</style>
</head>
<body>
<div class="container">
<h1>互动体验</h1>
<div id="step"></div>
<div style="text-align:center;margin-top:20px">
<button class="btn btn-secondary" onclick="prev()">上一步</button>
<button class="btn btn-primary" onclick="next()">下一步</button>
</div>
</div>
<div class="chat">
<button class="chat-btn" onclick="toggleChat()">💬</button>
<div class="chat-panel" id="panel">
<h3>AI对话</h3>
<input id="apiBase" placeholder="API地址">
<input id="apiKey" placeholder="API Key" type="password">
<div class="messages" id="msgs"></div>
<input id="chatInput" placeholder="输入消息..." onkeypress="if(event.key==='Enter')send()">
</div>
</div>
<script>
const steps=[
{q:'选择年龄',opts:['年轻成人','成年','成熟']},
{q:'选择特征',opts:['娇小玲珑','运动型','曲线迷人','经典优雅']},
{q:'敏感度',type:'slider'},
{q:'场景氛围',opts:['浪漫之夜','激情时刻','温柔亲密','探索冒险']},
{q:'互动环节',opts:['前戏调情','亲密接触','深入互动','温柔余韵']},
{q:'对话风格',opts:['温柔甜美','热情火辣','轻声细语','大胆直白']}
];
let cur=0,sel={};
function render(){
const s=steps[cur];
let h=`<div class="card"><h2>${s.q}</h2>`;
if(s.type==='slider'){
h+=`<input type="range" min="1" max="100" value="${sel.cur||50}" onchange="sel.cur=this.value;render()">`;
}else{
h+=`<div class="grid">`;
s.opts.forEach(o=>{
const on=sel[cur]===o?'selected':'';
h+=`<div class="option ${on}" onclick="sel[${cur}]='${o}';render()">${o}</div>`;
});
h+=`</div>`;
}
h+=`</div>`;
document.getElementById('step').innerHTML=h;
}
function next(){if(cur<steps.length-1)cur++;render()}
function prev(){if(cur>0)cur--;render()}
function toggleChat(){document.getElementById('panel').classList.toggle('open')}
function send(){
const v=document.getElementById('chatInput').value;
if(!v)return;
document.getElementById('msgs').innerHTML+=`<div class="msg user">${v}</div>`;
document.getElementById('chatInput').value='';
}
render();
</script>
</body>
</html>
